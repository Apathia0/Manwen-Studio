<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoryCanvas - AI 小说与漫画创作平台</title>
  <script>
    // 同步重定向：旧 framework 路由已删除 -> chapter-view
    (function() {
      if (location.pathname.indexOf('/pages/workspace/framework') !== -1) {
        var m = location.search.match(/storyId=(\d+)/)
        history.replaceState(null, '', m ? '/pages/workspace/chapter-view?storyId=' + m[1] : '/')
      }
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
