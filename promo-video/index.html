<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>StoryCanvas Promo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Noto+Serif+SC:wght@500;700;800&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 12%, rgba(247, 234, 214, 0.8), transparent 26%),
          radial-gradient(circle at 82% 16%, rgba(23, 166, 162, 0.16), transparent 24%),
          linear-gradient(135deg, #f8f4ec 0%, #eef2e8 54%, #e5efe8 100%);
        font-family: "Noto Sans SC", sans-serif;
      }

      [data-composition-id="storycanvas-promo"] {
        width: 1920px;
        height: 1080px;
        position: relative;
        overflow: hidden;
      }

      .ambient {
        position: absolute;
        width: 100%;
        height: 100%;
        inset: 0;
        pointer-events: none;
      }

      .ambient-grid {
        background-image:
          linear-gradient(rgba(15, 63, 63, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 63, 63, 0.05) 1px, transparent 1px);
        background-size: 72px 72px;
        opacity: 0.45;
      }

      .ambient-vignette {
        background:
          radial-gradient(circle at center, transparent 48%, rgba(15, 63, 63, 0.1) 100%);
      }

      .ambient-glow {
        background:
          radial-gradient(circle at 24% 24%, rgba(247, 234, 214, 0.9), transparent 22%),
          radial-gradient(circle at 78% 72%, rgba(23, 166, 162, 0.18), transparent 28%);
        opacity: 0.8;
        mix-blend-mode: screen;
      }

      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-composition-id="storycanvas-promo"
      data-start="0"
      data-duration="24"
      data-width="1920"
      data-height="1080"
    >
      <div class="ambient ambient-grid"></div>
      <div class="ambient ambient-glow"></div>
      <div class="ambient ambient-vignette"></div>

      <div
        id="scene-1"
        class="scene"
        data-composition-id="scene1-hero"
        data-composition-src="compositions/scene1-hero.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-2"
        class="scene"
        data-composition-id="scene2-workflow"
        data-composition-src="compositions/scene2-workflow.html"
        data-start="4.5"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-3"
        class="scene"
        data-composition-id="scene3-operations"
        data-composition-src="compositions/scene3-operations.html"
        data-start="11.5"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-4"
        class="scene"
        data-composition-id="scene4-cta"
        data-composition-src="compositions/scene4-cta.html"
        data-start="17.5"
        data-duration="6.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const rootTl = gsap.timeline({ paused: true });
      rootTl.to(".ambient-glow", { opacity: 0.95, duration: 12, ease: "sine.inOut" }, 0);
      rootTl.to(".ambient-glow", { opacity: 0.72, duration: 12, ease: "sine.inOut" }, 12);
      window.__timelines["storycanvas-promo"] = rootTl;
    </script>
  </body>
</html>
