services:
  proxy:
    build: .
    container_name: 9tu-proxy
    restart: always
    ports:
      - '127.0.0.1:8001:8001'
    volumes:
      - /opt/9tu-proxy:/config
    env_file:
      - ./.env
    environment:
      - PROXY_PORT=8001
      - CONFIG_DIR=/config
    networks:
      - baota_net

networks:
  baota_net:
    external: true
