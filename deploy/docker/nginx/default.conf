map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_real_ip $auth_limit_key {
    "" $binary_remote_addr;
    default $http_x_real_ip;
}

limit_req_zone $auth_limit_key zone=auth_limit:10m rate=5r/m;

# 生成图片的代理缓存：命中后不再经过 Python 后端（后端与生图任务共用同一个事件循环）。
# 只缓存图片；视频带 Range 请求，缓存会先拉全量文件拖慢首字节，保持直通。
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_images:20m max_size=2g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location ~ /\.(git|env|ssh) {
        deny all;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Real-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        # 引导确认/框架生成等 AI 调用可能耗时 2-5 分钟，需长超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
    }

    location ~ ^/api/auth/(login|forgot-password|reset-password|send-email-code)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Real-IP $remote_addr;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 图片（含 ?w=480 之类的缩略图请求，缓存键带查询参数）走代理缓存
    location ~* ^/static/.+\.(png|jpe?g|webp|gif)$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;

        proxy_cache static_images;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # H5 已移除：移动端与桌面端统一使用 Web 响应式页面，不再做 UA 跳转
    location / {
        try_files $uri $uri/ /index.html;
    }
}